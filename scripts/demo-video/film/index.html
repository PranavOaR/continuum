<!--
  Continuum's demo film, "The thread" (SPEC.md). Every terminal line and
  dashboard pixel comes from a real run recorded by ../capture.mjs and
  capture-dashboard.mjs. The voice is one continuous ElevenLabs take
  (assets/audio/voice.mp3), cut at its breaths into one clip per line.
-->

  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#fafaf7"},
    {"id":"color-ink","type":"color","label":"Text","default":"#141318"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#5b45ff"},
    {"id":"font-display","type":"string","label":"Display font","default":"Geist"}
  ]'

  <head>

      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
      :root {
        --color-ground: #fafaf7;
        --color-ink: #141318;
        --color-accent: #5b45ff;
        --font-display: "Geist";
        --muted: #5c5a62;
        --line: #e4e2dc;
        --success: #12804c;
        --danger: #cc2f2f;
        --term: #15141b;
        --term-bar: #1c1b23;
        --term-text: #f4f2ee;
        --term-dim: #aeaab6;
        --term-code: #f0c987;
        --term-ok: #3ccf8a;
        --term-bad: #f06a6a;
        --shadow: 0 40px 90px -30px rgb(20 19 24 / 0.45), 0 2px 6px rgb(20 19 24 / 0.08);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; font-family: var(--font-display), sans-serif; color: var(--color-ink); }
      /* A scene that overlaps its neighbour in a transition carries its own paper (.stage). */
      #ground, .stage { position: absolute; inset: 0; background: var(--color-ground); }
      .stage { overflow: hidden; }
      #ground::before, .stage::before {
        content: ""; position: absolute; inset: 0;
        background-image: radial-gradient(rgb(20 19 24 / 0.1) 1px, transparent 1.6px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 45%, transparent 100%);
        mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 45%, transparent 100%);
      }

      /* A terminal window: the brand's dark surface, the agent's own logo in the title bar. */
      .term { position: absolute; background: var(--term); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
      .term-bar { height: 64px; background: var(--term-bar); display: flex; align-items: center; gap: 14px; padding: 0 26px; }
      .term-lights { display: flex; gap: 10px; margin-right: 10px; }
      .term-lights i { width: 15px; height: 15px; border-radius: 50%; background: #3a3745; display: block; }
      .term-logo { width: 30px; height: 30px; }
      .term-title { font-family: "Geist Mono", monospace; font-size: 22px; color: var(--term-dim); letter-spacing: 0.01em; }
      .term-body { padding: 34px 48px; font-family: "Geist Mono", monospace; font-size: 29px; line-height: 45px; color: var(--term-text); }
      .term-line { position: relative; height: 45px; white-space: pre; }
      .dim { color: var(--term-dim); }
      .code { color: var(--term-code); }
      .ok { color: var(--term-ok); }
      .bad { color: var(--term-bad); }
      .caret { position: absolute; width: 16px; height: 34px; top: 6px; background: var(--term-text); }

      /* A card: the dashboard's own surfaces, rebuilt at video size. */
      .card { position: absolute; background: #fff; border: 1.5px solid var(--line); border-radius: 20px; box-shadow: 0 30px 70px -30px rgb(20 19 24 / 0.32), 0 1px 3px rgb(20 19 24 / 0.06); }
      .label { font-family: "Geist Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; }
      .chip { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 14px; font-family: "Geist Mono", monospace; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .chip svg { width: 22px; height: 22px; }
      .chip-ok { color: var(--success); border-color: rgb(18 128 76 / 0.35); background: rgb(18 128 76 / 0.07); }
    </style>
  </head>
