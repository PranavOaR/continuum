    (function () {
      const tl = gsap.timeline({ paused: true });
      // When each letter of "continuum" lands: a person typing, a little uneven, not a metronome.
      const KEYS = [1.2, 1.27, 1.35, 1.41, 1.49, 1.55, 1.62, 1.7, 1.76];
