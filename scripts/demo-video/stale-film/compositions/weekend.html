<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #wk-days { position: absolute; left: 420px; top: 400px; width: 1080px; height: 200px; }

    #wk-head { position: absolute; left: -11px; top: 151px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-ink); }

    #wk-kicker .swap, #wk-k2 { position: absolute; }
  </style>
  <div id="root" data-composition-id="weekend" data-width="1920" data-height="1080" data-layout-allow-overflow>
    <div id="wk-stage" class="stage">
      <div id="wk-days">
        <div id="wk-track"></div>
        <div id="wk-fill"></div>
        <div id="wk-head"></div>
        <div class="wk-day" id="wk-d0" style="left: 0px">Fri</div>
        <div class="wk-day" id="wk-d1" style="left: 360px">Sat</div>

        <div class="wk-day" id="wk-d3" style="left: 1080px">Mon</div>
      </div>
      <div id="wk-kicker" class="kicker" data-layout-allow-overlap>
        <div class="swap" id="wk-k1">The weekend</div>
        <div class="swap" id="wk-k2">Monday · 9:12 am</div>
      </div>
    </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      gsap.set("#wk-fill", { scaleX: 0 });
      gsap.set("#wk-k2", { opacity: 0 });
      gsap.set("#wk-d0", { color: "#141318" });

      // The desk slides in from the right as Friday leaves to the left.
      tl.fromTo("#wk-stage", { x: 1920 }, { x: 0, duration: 0.85, ease: "power3.inOut" }, 0);
      tl.fromTo("#wk-k1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);

      // The playhead runs the weekend; each day darkens as it passes, then fades back.
      tl.to("#wk-fill", { scaleX: 1, duration: 1.8, ease: "power2.inOut" }, 1.4);
      tl.to("#wk-head", { x: 1080, duration: 1.8, ease: "power2.inOut" }, 1.4);
      tl.to("#wk-d0", { color: "#cfccc4", duration: 0.3 }, 1.6);
      tl.to("#wk-d1", { color: "#141318", duration: 0.2, yoyo: true, repeat: 1 }, 2.05);
      tl.to("#wk-d2", { color: "#141318", duration: 0.2, yoyo: true, repeat: 1 }, 2.6);
      tl.to("#wk-d3", { color: "#141318", duration: 0.25 }, 3.1);
      tl.fromTo("#wk-d3", { scale: 1 }, { scale: 1.12, duration: 0.35, ease: "back.out(1.6)" }, 3.1);
      tl.to("#wk-k1", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 3.1);
      tl.fromTo("#wk-k2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 3.3);
      tl.set({}, {}, 4.8);

      window.__timelines["weekend"] = tl;
    })();
  </script>
