name: Release

# Publishes getcontinuum, updates the public plugin repository and creates the
# GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Needs, once:
# - npm trusted publishing for getcontinuum: user PranavOaR, repository continuum,
#   workflow release.yml (npmjs.com, package settings). No npm token is stored.
# - The PLUGIN_REPO_DEPLOY_KEY secret: the private half of a deploy key with write
#   access to PranavOaR/continuum-plugin.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm trusted publishing signs in with this workflow's OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Checked out first, so a missing or read-only deploy key fails in seconds, before the checks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: PranavOaR/continuum-plugin
          path: continuum-plugin
          ssh-key: ${{ secrets.PLUGIN_REPO_DEPLOY_KEY }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version"
            exit 1
          fi
      - name: The changelog has a dated section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="$(grep -E "^## \\[${version//./\\.}\\]" CHANGELOG.md || true)"
          if [ -z "$heading" ] || echo "$heading" | grep -qi unreleased; then
            echo "CHANGELOG.md needs '## [$version] - YYYY-MM-DD' before releasing (found: '${heading:-nothing}')"
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run build
      - run: npm run bundle
      - run: npm run smoke:release
      # Skipped when this version is already on npm, so a run that failed after publishing can be re-run.
      # npm adds provenance by itself when the source repository is public.
      - name: Publish to npm
        working-directory: dist/release
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already published"
          else
            npm publish --access public
          fi
      - name: Update the plugin repository
        run: |
          npm run plugin
          node scripts/sync-plugin-repo.mjs continuum-plugin
          cd continuum-plugin
          git add -A
          if git diff --cached --quiet; then
            echo "The plugin repository already has $GITHUB_REF_NAME"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "release: ${GITHUB_REF_NAME#v}"
          git push
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Continuum $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
